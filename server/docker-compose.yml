services:
  api:
    image: node:24-alpine
    restart: unless-stopped
    command: ["node", "--no-warnings", "/app/app.js"]
    environment:
      - DB_PATH=/data/aksha.db
      - PORT=3000
    volumes:
      - ./app.js:/app/app.js:ro
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  caddy_data:
  caddy_config:
